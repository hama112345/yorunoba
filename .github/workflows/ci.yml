name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型チェック + クライアントのビルド
        run: npm run build
      - name: ユニット・サーバーテスト
        run: npm test
      - name: E2E（2人入店して移動が同期されるか）
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
