<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1220" />
    <title>ヨルノバ — 夜の居酒屋で、ちょっと話そう</title>
    <meta name="description" content="仕事帰りにふらっと寄れる、テキストだけの居酒屋メタバース。" />
    <style>
      :root {
        --bg: #1a1220;
        --panel: rgba(20, 14, 26, 0.82);
        --text: #f6eadb;
        --accent: #e8a33d;
        --danger: #e4572e;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
        overscroll-behavior: none;
      }
      #game { position: fixed; inset: 0; }
      #hud {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 12px;
        right: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        pointer-events: none;
        font-size: 14px;
      }
      .pill {
        background: var(--panel);
        border: 1px solid rgba(232, 163, 61, 0.35);
        border-radius: 999px;
        padding: 6px 12px;
        white-space: nowrap;
      }
      #status[data-state="error"] { border-color: var(--danger); color: #ffd2c4; }
      .brand { color: var(--accent); font-weight: 700; letter-spacing: 0.08em; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud">
      <span class="pill"><span class="brand">ヨルノバ</span> 1号店</span>
      <span class="pill" id="status" data-state="connecting">入店中…</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
