<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1220" />
    <title>ヨルノバ — 夜の居酒屋で、ちょっと話そう</title>
    <meta name="description" content="仕事帰りにふらっと寄れる、テキストだけの居酒屋メタバース。" />
    <style>
      :root {
        --bg: #1a1220;
        --panel: rgba(20, 14, 26, 0.82);
        --text: #f6eadb;
        --accent: #e8a33d;
        --danger: #e4572e;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
        overscroll-behavior: none;
      }
      #game { position: fixed; inset: 0; }
      #hud {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 12px;
        right: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        pointer-events: none;
        font-size: 14px;
      }
      .pill {
        background: var(--panel);
        border: 1px solid rgba(232, 163, 61, 0.35);
        border-radius: 999px;
        padding: 6px 12px;
        white-space: nowrap;
      }
      #status[data-state="error"] { border-color: var(--danger); color: #ffd2c4; }
      .brand { color: var(--accent); font-weight: 700; letter-spacing: 0.08em; }

      /* 入店画面（のれんの前）。店の絵が透けて見えるように半透明 */
      #entrance {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(10, 6, 14, 0.55);
        overflow-y: auto;
        z-index: 10;
      }
      #entrance .card {
        width: min(420px, 100%);
        background: var(--panel);
        border: 1px solid rgba(232, 163, 61, 0.45);
        border-radius: 16px;
        padding: 20px 20px 16px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      }
      #entrance h1 { margin: 0; font-size: 32px; text-align: center; }
      #entrance .lead { margin: 6px 0 4px; text-align: center; line-height: 1.6; opacity: 0.9; }
      #entrance .guests { margin: 4px 0 0; text-align: center; color: var(--accent); }
      #entrance .field { display: block; border: 0; padding: 0; margin: 14px 0 0; }
      #entrance .field > span, #entrance legend { display: block; font-size: 13px; margin-bottom: 6px; opacity: 0.85; }
      #entrance legend small { opacity: 0.75; }
      #entrance input[name="name"] {
        width: 100%;
        font-size: 16px; /* 16px未満だとiPhoneが勝手にズームする */
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(246, 234, 219, 0.25);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
      }
      #entrance .swatches, #entrance .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      #entrance .swatch {
        width: 34px; height: 34px; border-radius: 50%;
        background: var(--c);
        border: 2px solid rgba(255, 255, 255, 0.2);
        cursor: pointer;
      }
      #entrance .swatch[aria-pressed="true"] { border-color: #ffd27a; box-shadow: 0 0 0 3px rgba(255, 210, 122, 0.35); }
      #entrance .chip {
        font-size: 14px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(232, 163, 61, 0.4);
        background: transparent;
        color: var(--text);
        cursor: pointer;
      }
      #entrance .chip[aria-pressed="true"] { background: var(--accent); color: #1a1220; border-color: var(--accent); }
      #entrance .chip:disabled { opacity: 0.35; cursor: default; }
      #entrance .adult { display: flex; align-items: center; gap: 8px; margin: 16px 0 0; font-size: 15px; }
      #entrance .adult input { width: 20px; height: 20px; }
      #entrance .enter {
        width: 100%;
        margin-top: 14px;
        padding: 14px;
        font-size: 17px;
        font-weight: 700;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(#c0392b, #8e2a20);
        color: #fff4e6;
        cursor: pointer;
      }
      #entrance .enter:disabled { opacity: 0.45; cursor: default; }
      #entrance .error { color: #ffd2c4; font-size: 14px; margin: 10px 0 0; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud">
      <span class="pill"><span class="brand">ヨルノバ</span> 1号店</span>
      <span class="pill" id="status" data-state="waiting">のれんの前</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
