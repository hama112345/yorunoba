<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1220" />
    <title>ヨルノバ — 夜の居酒屋で、ちょっと話そう</title>
    <meta name="description" content="仕事帰りにふらっと寄れる、テキストだけの居酒屋メタバース。" />
    <!-- SNSで共有されたときの見え方（画像は scripts/og-image.mjs で店の画面から作る。URLは公開中の店） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ヨルノバ" />
    <meta property="og:title" content="ヨルノバ — 夜の居酒屋で、ちょっと話そう" />
    <meta property="og:description" content="仕事帰りにふらっと寄れる、テキストだけの居酒屋。登録なし・ブラウザですぐ入れます。毎晩21時開店。" />
    <meta property="og:url" content="https://yorunoba.onrender.com/" />
    <meta property="og:image" content="https://yorunoba.onrender.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        --bg: #1a1220;
        --panel: rgba(20, 14, 26, 0.82);
        --text: #f6eadb;
        --accent: #e8a33d;
        --danger: #e4572e;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
        overscroll-behavior: none;
      }
      #game { position: fixed; inset: 0; }
      #hud {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 12px;
        right: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        pointer-events: none;
        font-size: 14px;
      }
      .pill {
        background: var(--panel);
        border: 1px solid rgba(232, 163, 61, 0.35);
        border-radius: 999px;
        padding: 6px 12px;
        white-space: nowrap;
      }
      #status[data-state="error"] { border-color: var(--danger); color: #ffd2c4; }
      #hud .right { display: flex; gap: 6px; align-items: center; }
      #hud .sound { pointer-events: auto; cursor: pointer; color: var(--text); font-size: 14px; }
      #hud .sound[hidden] { display: none; }
      .brand { color: var(--accent); font-weight: 700; letter-spacing: 0.08em; }

      /* 入店画面（のれんの前）。店の絵が透けて見えるように半透明 */
      #entrance {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(10, 6, 14, 0.55);
        overflow-y: auto;
        z-index: 10;
      }
      #entrance .card {
        width: min(420px, 100%);
        background: var(--panel);
        border: 1px solid rgba(232, 163, 61, 0.45);
        border-radius: 16px;
        padding: 20px 20px 16px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      }
      #entrance h1 { margin: 0; font-size: 32px; text-align: center; }
      #entrance .lead { margin: 6px 0 4px; text-align: center; line-height: 1.6; opacity: 0.9; }
      #entrance .guests { margin: 4px 0 0; text-align: center; color: var(--accent); }
      #entrance .field { display: block; border: 0; padding: 0; margin: 14px 0 0; }
      #entrance .field > span, #entrance legend { display: block; font-size: 13px; margin-bottom: 6px; opacity: 0.85; }
      #entrance legend small { opacity: 0.75; }
      #entrance input[name="name"] {
        width: 100%;
        font-size: 16px; /* 16px未満だとiPhoneが勝手にズームする */
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(246, 234, 219, 0.25);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
      }
      #entrance .swatches, #entrance .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      #entrance .swatch {
        width: 34px; height: 34px; border-radius: 50%;
        background: var(--c);
        border: 2px solid rgba(255, 255, 255, 0.2);
        cursor: pointer;
      }
      #entrance .swatch[aria-pressed="true"] { border-color: #ffd27a; box-shadow: 0 0 0 3px rgba(255, 210, 122, 0.35); }
      #entrance .chip {
        font-size: 14px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(232, 163, 61, 0.4);
        background: transparent;
        color: var(--text);
        cursor: pointer;
      }
      #entrance .chip[aria-pressed="true"] { background: var(--accent); color: #1a1220; border-color: var(--accent); }
      #entrance .chip:disabled { opacity: 0.35; cursor: default; }
      #entrance .adult { display: flex; align-items: center; gap: 8px; margin: 16px 0 0; font-size: 15px; }
      #entrance .adult input { width: 20px; height: 20px; }
      #entrance .enter {
        width: 100%;
        margin-top: 14px;
        padding: 14px;
        font-size: 17px;
        font-weight: 700;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(#c0392b, #8e2a20);
        color: #fff4e6;
        cursor: pointer;
      }
      #entrance .enter:disabled { opacity: 0.45; cursor: default; }
      #entrance .error { color: #ffd2c4; font-size: 14px; margin: 10px 0 0; }

      /* 画面下の会話欄 */
      #chat {
        position: fixed;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: min(640px, 100%);
        padding: 0 10px max(10px, env(safe-area-inset-bottom));
        pointer-events: none; /* 会話欄の上の余白は、下の店をタップできるようにする */
        z-index: 5;
      }
      #chat .log {
        list-style: none;
        margin: 0 0 6px;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 14px;
      }
      #chat .log li {
        align-self: flex-start;
        max-width: 100%;
        background: rgba(20, 14, 26, 0.72);
        border-radius: 10px;
        padding: 3px 9px;
        line-height: 1.45;
        overflow-wrap: anywhere;
        animation: chat-in 160ms ease-out;
      }
      #chat .log li b { color: var(--accent); font-weight: 700; margin-right: 2px; }
      #chat .log li.self b { color: #ffd27a; }
      #chat .notice[hidden] { display: none; }
      #chat .notice {
        margin: 0 0 6px;
        font-size: 13px;
        color: #1a1220;
        background: #ffd27a;
        border-radius: 8px;
        padding: 4px 10px;
        display: inline-block;
      }
      #chat .bar {
        display: flex;
        gap: 6px;
        pointer-events: auto;
        background: var(--panel);
        border: 1px solid rgba(232, 163, 61, 0.45);
        border-radius: 14px;
        padding: 6px;
      }
      #chat .bar input {
        flex: 1;
        min-width: 0;
        font-size: 16px; /* 16px未満だとiPhoneが勝手にズームする */
        padding: 9px 10px;
        border: 0;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--text);
      }
      #chat .bar button {
        font-size: 15px;
        font-weight: 700;
        padding: 0 16px;
        border: 0;
        border-radius: 10px;
        background: linear-gradient(#c0392b, #8e2a20);
        color: #fff4e6;
      }
      @keyframes chat-in { from { opacity: 0; transform: translateY(4px); } }

      #entrance .terms { font-size: 12px; line-height: 1.6; opacity: 0.75; margin: 10px 0 0; }
      #entrance .terms a { color: var(--accent); }

      /* アバターをタップしたときの名札カード */
      .guest-card {
        position: fixed;
        left: 50%;
        top: max(64px, env(safe-area-inset-top));
        transform: translateX(-50%);
        width: min(320px, calc(100% - 32px));
        background: var(--panel);
        border: 1px solid rgba(232, 163, 61, 0.6);
        border-radius: 14px;
        padding: 14px 16px 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        z-index: 20;
      }
      .guest-card .name { margin: 0; font-size: 17px; font-weight: 700; }
      .guest-card .tags { margin: 4px 0 12px; color: #ffe3a3; font-size: 14px; }
      .guest-card .actions { display: flex; gap: 8px; justify-content: flex-end; }
      .guest-card button {
        font-size: 14px;
        padding: 8px 14px;
        border-radius: 10px;
        border: 1px solid rgba(246, 234, 219, 0.3);
        background: transparent;
        color: var(--text);
      }
      .guest-card button.danger { border-color: var(--danger); color: #ffd2c4; }

      /* 留置所 */
      #jail {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        background: repeating-linear-gradient(90deg, rgba(10, 6, 14, 0.92) 0 38px, rgba(60, 60, 70, 0.95) 38px 46px);
        z-index: 30;
      }
      #jail .card {
        width: min(380px, 100%);
        background: var(--panel);
        border: 1px solid var(--danger);
        border-radius: 16px;
        padding: 20px;
        text-align: center;
      }
      #jail h2 { margin: 0 0 8px; font-size: 20px; }
      #jail .left { font-size: 22px; font-weight: 700; color: #ffd27a; margin: 14px 0; }
      #jail .note { font-size: 13px; opacity: 0.8; margin: 0; }

      /* 吹き出しをタップしたときの「わかる／笑／へぇ」 */
      .reaction-picker {
        position: fixed;
        display: flex;
        gap: 6px;
        padding: 6px;
        background: var(--panel);
        border: 1px solid rgba(232, 163, 61, 0.6);
        border-radius: 999px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
        z-index: 20;
      }
      .reaction-picker button {
        font-size: 15px;
        padding: 6px 12px;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        cursor: pointer;
      }
      .reaction-picker button:hover { background: var(--accent); color: #1a1220; }

      /* HUDの下：常連パス（準備中）と友だちを誘う */
      #actions {
        position: fixed;
        top: calc(max(12px, env(safe-area-inset-top)) + 40px);
        right: 12px;
        display: flex;
        gap: 6px;
        z-index: 4;
      }
      #actions[hidden] { display: none; }
      #actions .action { cursor: pointer; color: var(--text); font-size: 13px; padding: 5px 10px; }
      #actions #pass { border-color: rgba(255, 210, 122, 0.7); color: #ffe3a3; }

      /* 画面の外にいる客の札（押すとその人のほうへ歩く） */
      .edge-marker {
        position: fixed;
        transform: translate(-50%, -50%);
        font-size: 12px;
        padding: 4px 9px;
        border-radius: 999px;
        border: 1px solid rgba(255, 210, 122, 0.55);
        background: rgba(20, 14, 26, 0.78);
        color: #ffe3a3;
        white-space: nowrap;
        cursor: pointer;
        z-index: 3;
      }

      /* 会話欄の「店からのお知らせ」 */
      #chat .log li.announce { background: rgba(142, 42, 32, 0.85); color: #fff4e6; }
      #chat .log li.wiped { opacity: 0.7; font-style: italic; }

      /* 入店画面の営業時間・準備中 */
      #entrance .hours { margin: 4px 0 0; text-align: center; font-size: 12px; opacity: 0.75; white-space: pre-line; }
      #entrance .closed[hidden] { display: none; }
      #entrance .closed {
        margin: 12px 0 0;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        text-align: center;
      }
      #entrance .closed p { margin: 0; }
      #entrance .closed-title { font-size: 17px; font-weight: 700; color: #ffd27a; }
      #entrance .closed-until { font-size: 14px; margin-top: 4px !important; }
      #entrance .closed .waitlist, .modal .waitlist { display: inline-block; margin-top: 8px; color: var(--accent); }

      /* 画面中央のお知らせ窓（常連パスなど） */
      .modal {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(10, 6, 14, 0.6);
        z-index: 25;
      }
      .modal .card {
        width: min(380px, 100%);
        max-height: 100%;
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid rgba(255, 210, 122, 0.6);
        border-radius: 16px;
        padding: 18px 18px 14px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      }
      .modal h2 { margin: 0; font-size: 20px; }
      .modal h2 small { font-size: 13px; opacity: 0.75; font-weight: 400; }
      .modal .price { margin: 6px 0 10px; color: #ffe3a3; }
      .modal .price b { font-size: 22px; }
      .modal .perks { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; line-height: 1.5; }
      .modal .ask { margin: 14px 0 6px; font-size: 14px; }
      .modal .answers { display: flex; flex-wrap: wrap; gap: 6px; }
      .modal .answers button {
        font-size: 14px;
        padding: 7px 11px;
        border-radius: 999px;
        border: 1px solid rgba(232, 163, 61, 0.5);
        background: transparent;
        color: var(--text);
        cursor: pointer;
      }
      .modal .answers button[aria-pressed="true"] { background: var(--accent); color: #1a1220; border-color: var(--accent); }
      .modal .answers button:disabled:not([aria-pressed="true"]) { opacity: 0.4; }
      .modal .thanks[hidden] { display: none; }
      .modal .thanks { margin: 8px 0 0; font-size: 14px; color: #ffd27a; }
      .modal .later { margin: 10px 0 0; font-size: 13px; opacity: 0.8; }
      .modal .close {
        display: block;
        width: 100%;
        margin-top: 14px;
        padding: 10px;
        font-size: 15px;
        border-radius: 10px;
        border: 1px solid rgba(246, 234, 219, 0.3);
        background: transparent;
        color: var(--text);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud">
      <span class="pill"><span class="brand">ヨルノバ</span> 1号店</span>
      <span class="right">
        <button type="button" class="pill sound" id="sound" hidden aria-label="店内の音">🔊</button>
        <span class="pill" id="status" data-state="waiting">のれんの前</span>
      </span>
    </div>
    <div id="actions" hidden>
      <button type="button" class="pill action" id="pass">🎫 常連パス</button>
      <button type="button" class="pill action" id="invite">📨 誘う</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
