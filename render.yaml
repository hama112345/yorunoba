# Render（https://render.com）の設定。READMEの「Deploy to Render」ボタンから読み込まれる。
# 1つのWebサービスが、ゲームサーバー（WebSocket）と画面（ビルド済みクライアント）を両方配信する。
# main ブランチにpushするたびに自動で更新される。
services:
  - type: web
    name: yorunoba
    runtime: node
    # 無料プランは15分アクセスがないと眠り、次の入店に1分ほどかかる。
    # D10の一般公開前に starter（月7ドル）へ切り替える。
    plan: free
    region: singapore # 日本から一番近いリージョン
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # D8（AI店員）で ANTHROPIC_API_KEY を追加する。値はRenderの画面で入力し、ここには書かない
